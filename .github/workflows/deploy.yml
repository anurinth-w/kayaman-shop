name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kayaman-frontend/package-lock.json

      - name: Install dependencies
        working-directory: kayaman-frontend
        run: npm ci

      - name: Lint
        working-directory: kayaman-frontend
        run: npm run lint

      - name: Build
        working-directory: kayaman-frontend
        run: npm run build